<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // CSV Parser
  function parseCSV(text) {
    const lines = text.trim().split('\n');
    const headers = lines[0].split(',').map(h => h.trim());
    const results = [];
    
    for (let i = 1; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      const row = [];
      let inQuotes = false;
      let current = '';
      
      for (let char of lines[i]) {
        if (char === '"' || char === "'") {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          row.push(current.trim().replace(/^["']|["']$/g, ''));
          current = '';
        } else {
          current += char;
        }
      }
      row.push(current.trim().replace(/^["']|["']$/g, ''));
      
      const item = {};
      headers.forEach((h, idx) => { item[h] = row[idx] || ''; });
      results.push(item);
    }
    return results;
  }

  // Render Engine
  async function loadProducts() {
    try {
      const response = await fetch(window.GARGI_CONFIG.productsFile);
      const text = await response.text();
      const products = parseCSV(text);
      
      const categories = {};
      products.forEach(p => {
        const cat = p.Category || 'Other';
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push(p);
      });

      const container = document.getElementById('products-container');
      container.innerHTML = '';

      for (const [categoryName, items] of Object.entries(categories)) {
        const section = document.createElement('section');
        const catId = 'cat-' + categoryName.toLowerCase().replace(/[^a-z0-9]+/g, '-');
        section.className = 'category-section';
        section.id = catId;

        let itemsHTML = items.map(item => {
          const benefitsList = item.Benefits ? item.Benefits.split('|').map(b => `<li>${b.trim()}</li>`).join('') : '';
          const waMsg = encodeURIComponent(item.WhatsAppMessage || `Namaste, I am interested in ${item.Name}`);
          
          return `
            <div class="product-card">
              <div class="product-image">
                <img src="${item.Image}" alt="${item.Name}" onerror="this.parentElement.textContent='${item.Name}'">
              </div>
              <div class="product-info">
                <h3 class="product-title">${item.Name}</h3>
                ${item.Tagline ? `<div class="product-tagline">${item.Tagline}</div>` : ''}
                <div class="product-price">${item.Price}</div>
                ${benefitsList ? `<ul class="product-benefits">${benefitsList}</ul>` : ''}
                <a href="https://wa.me/${window.GARGI_CONFIG.whatsappNumber}?text=${waMsg}" class="btn btn-primary" target="_blank" rel="noopener">Inquire via WhatsApp</a>
              </div>
            </div>
          `;
        }).join('');

        // Dynamic Poster End Cards Insertion
        if (categoryName === "Vastu Remedy Items") {
          itemsHTML += `
            <div class="product-card cta-poster-card">
              <div class="product-image">
                <img src="product-images/laxmi-yantra-pyramid.jpg" alt="Custom Vastu Remedies" onerror="this.parentElement.textContent='Custom Vastu Remedies'">
              </div>
              <div class="product-info">
                <h3 class="product-title">Custom &amp; Extended Remedies</h3>
                <p style="font-size:0.88rem; opacity:0.85; margin-bottom:16px;">Looking for specific Pyramids, Yantras, Crystal Gemstone Trees, or custom-tailored remedies for your space?</p>
                <a href="https://wa.me/${window.GARGI_CONFIG.whatsappNumber}?text=Namaste%20Gargi%20Ji%2C%20I%20am%20inquiring%20about%20Custom%20and%20Extended%20Vastu%20Remedies." class="btn btn-primary" target="_blank" rel="noopener">Inquire via WhatsApp</a>
              </div>
            </div>
          `;
        } else if (categoryName === "Spiritual Jewelry") {
          itemsHTML += `
            <div class="product-card cta-poster-card">
              <div class="product-image">
                <img src="product-images/bracelets-collection.jpg" alt="Custom Spiritual Jewelry" onerror="this.parentElement.textContent='Custom Spiritual Jewelry'">
              </div>
              <div class="product-info">
                <h3 class="product-title">Bespoke Spiritual Jewelry</h3>
                <p style="font-size:0.88rem; opacity:0.85; margin-bottom:16px;">Need specific gemstones, custom mala combinations, or energized protection items tailored to your Kundali?</p>
                <a href="https://wa.me/${window.GARGI_CONFIG.whatsappNumber}?text=Namaste%20Gargi%20Ji%2C%20I%20am%20inquiring%20about%20Custom%20Spiritual%20Jewelry." class="btn btn-primary" target="_blank" rel="noopener">Inquire via WhatsApp</a>
              </div>
            </div>
          `;
        }

        section.innerHTML = `
          <h2>${categoryName}</h2>
          <div class="product-grid">${itemsHTML}</div>
        `;
        container.appendChild(section);
      }
    } catch (err) {
      console.error("Error parsing product CSV:", err);
    }
  }

  document.addEventListener('DOMContentLoaded', loadProducts);
</script>
